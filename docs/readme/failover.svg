<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" role="img" aria-labelledby="t d">
  <title id="t">Автосмена сервера</title>
  <desc id="d">Когда сервер перестал отвечать или замёрз, Detour пробует сначала тот же сервер с другим транспортом, потом сервер той же страны в другой сети хостинга, учитывая, какие протоколы работают у вашего провайдера.</desc>
  <style>
    :root { --bg:#0b0d10; --panel:#14171c; --line:#262b33; --ink:#e6e9ee; --muted:#6e7783; --accent:#4f8cff; --warn:#c27c2c; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#f6f7f9; --panel:#ffffff; --line:#dadde2; --ink:#14171c; --muted:#6a717c; --accent:#2a6ee0; --warn:#b8660f; }
    }
    .bg { fill: var(--bg); }
    .panel { fill: var(--panel); stroke: var(--line); }
    .warnbox { fill: var(--panel); stroke: var(--warn); }
    .ink { fill: var(--ink); }
    .muted { fill: var(--muted); }
    .accent { fill: var(--accent); }
    .warn { fill: var(--warn); }
    .sans { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "Cascadia Mono", "JetBrains Mono", Consolas, Menlo, monospace; }
    .arrow { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect class="bg" width="1280" height="300"/>
  <text x="48" y="54" class="muted mono" font-size="12" letter-spacing="1.5">АВТОСМЕНА: КОГО ПРОБОВАТЬ СЛЕДУЮЩИМ</text>

  <g class="sans">
    <!-- the trigger -->
    <g transform="translate(48 86)">
      <rect class="warnbox" width="236" height="128" rx="10"/>
      <text x="20" y="34" class="warn mono" font-size="12" letter-spacing="1.5">СЕРВЕР</text>
      <text x="20" y="64" class="ink" font-size="17" font-weight="600">не отвечает</text>
      <text x="20" y="90" class="ink" font-size="17" font-weight="600">или замёрз</text>
      <text x="20" y="114" class="muted" font-size="13">данные встали после ~16 КБ</text>
    </g>
    <path class="arrow" d="M284 150H318M310 142l8 8-8 8"/>

    <g transform="translate(326 86)">
      <rect class="panel" width="290" height="128" rx="10"/>
      <text x="20" y="34" class="accent mono" font-size="13">1</text>
      <text x="44" y="34" class="ink" font-size="17" font-weight="600">Тот же сервер,</text>
      <text x="44" y="58" class="ink" font-size="17" font-weight="600">другой транспорт</text>
      <text x="44" y="86" class="muted" font-size="13">REALITY → XHTTP → Hysteria2:</text>
      <text x="44" y="106" class="muted" font-size="13">часто заморожен только способ связи</text>
    </g>
    <path class="arrow" d="M616 150H650M642 142l8 8-8 8"/>

    <g transform="translate(658 86)">
      <rect class="panel" width="290" height="128" rx="10"/>
      <text x="20" y="34" class="accent mono" font-size="13">2</text>
      <text x="44" y="34" class="ink" font-size="17" font-weight="600">Та же страна,</text>
      <text x="44" y="58" class="ink" font-size="17" font-weight="600">другая сеть хостинга</text>
      <text x="44" y="86" class="muted" font-size="13">заморозки часто накрывают</text>
      <text x="44" y="106" class="muted" font-size="13">целое облако, а не один сервер</text>
    </g>
    <path class="arrow" d="M948 150H982M974 142l8 8-8 8"/>

    <g transform="translate(990 86)">
      <rect class="panel" width="242" height="128" rx="10"/>
      <text x="20" y="34" class="accent mono" font-size="13">3</text>
      <text x="44" y="34" class="ink" font-size="17" font-weight="600">Остальные</text>
      <text x="44" y="58" class="ink" font-size="17" font-weight="600">по пингу</text>
      <text x="44" y="86" class="muted" font-size="13">без мёртвых и уже</text>
      <text x="44" y="106" class="muted" font-size="13">опробованных</text>
    </g>
  </g>

  <text x="48" y="258" class="muted sans" font-size="15">На каждом шаге протоколы, которые у вашего провайдера сейчас плохо проходят (по данным Detour Map), пробуются позже.</text>
</svg>
