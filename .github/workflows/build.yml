name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test --project v2rayN\ServiceLib.Tests\ServiceLib.Tests.csproj

      - name: Publish (win-x64, self-contained)
        run: dotnet publish v2rayN\v2rayN\v2rayN.csproj -c Release -r win-x64 --self-contained true -o out\Detour

      - name: Zip
        run: Compress-Archive -Path out\Detour -DestinationPath Detour-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Detour-win-x64
          path: Detour-win-x64.zip
