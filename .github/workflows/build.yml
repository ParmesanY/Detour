name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test --project v2rayN\ServiceLib.Tests\ServiceLib.Tests.csproj

      # Full package: app + Xray + sing-box + geo files + rule sets + zapret,
      # so the first start works where GitHub is blocked.
      - name: Package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          ./tools/package-release.ps1 -OutDir out -Version $ver

      - uses: actions/upload-artifact@v4
        with:
          name: Detour-win-x64
          path: out/Detour*.zip

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/Detour-*-win-x64.zip
          generate_release_notes: true
