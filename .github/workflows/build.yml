name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Build and test steps get a read-only token; only the publish job below may write (the release).
permissions:
  contents: read

# A newer push to the same branch cancels the run still in progress; tag builds are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            required: true
          # Linux runs the same tests to catch platform assumptions; not yet a release gate.
          - os: ubuntu-latest
            required: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Test
        run: dotnet test --project v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj

  # The kill switch for real on a throwaway runner (elevated): the firewall rule must cut other programs off and
  # come off cleanly, also after a client crash. Never run these tests on a developer's PC.
  killswitch:
    runs-on: windows-latest
    # A block that cuts the runner itself off would otherwise hang the job for hours (0.3.11's first run did).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Built before the block: nothing has to be downloaded while outbound traffic is cut.
      - name: Build tests
        run: dotnet build v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj

      # The kill switch blocks every program it doesn't know, the runner's own agent included: it would no longer
      # reach GitHub, and the job would hang. Allow the agent (not part of what's tested: curl stands for "others").
      - name: Firewall on, runner allowed
        shell: pwsh
        run: |
          Set-NetFirewallProfile -All -Enabled True
          $agents = Get-Process Runner.Listener, Runner.Worker -ErrorAction SilentlyContinue | ForEach-Object Path | Sort-Object -Unique
          foreach ($p in $agents) {
            New-NetFirewallRule -DisplayName "ci runner $([IO.Path]::GetFileName($p))" -Group 'ci-runner' -Direction Outbound -Action Allow -Program $p | Out-Null
            Write-Host "allowed $p"
          }
          if (-not $agents) { throw 'runner processes not found' }

      - name: Kill switch tests
        env:
          DETOUR_LIVE_KILLSWITCH: '1'
        run: dotnet test --no-build --project v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj -- --treenode-filter "/*/*/KillSwitchLiveTests/*"

  build:
    # Not on killswitch yet: make it a gate once it has run green on GitHub a few times.
    needs: test
    strategy:
      fail-fast: false
      # macOS runners are scarce and can sit in the queue for hours: they build after the release is out (build-macos).
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Full package: app + Xray + sing-box + geo files + rule sets + zapret (winws or tpws),
      # so the first start works where GitHub is blocked. Core versions and hashes: tools/cores.lock.json.
      - name: Package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          ./tools/package-release.ps1 -OutDir out -Version $ver -Rid ${{ matrix.rid }}

      # Smoke check: the archive unpacks and holds the app and every core it promises.
      - name: Check archive
        shell: pwsh
        run: |
          $x = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force $x | Out-Null
          $a = Get-ChildItem out -File | Where-Object { $_.Name -match '^Detour.*\.(zip|tar\.gz)$' } | Select-Object -First 1
          if ($a.Name.EndsWith('.zip')) { Expand-Archive $a.FullName $x } else { tar -xzf $a.FullName -C $x; if ($LASTEXITCODE) { throw 'tar failed' } }
          $win = '${{ matrix.rid }}' -eq 'win-x64'
          $need = if ($win) { 'Detour.exe', 'bin/xray/xray.exe', 'bin/sing_box/sing-box.exe', 'bin/zapret/current/bin/winws.exe', 'bin/tor/tor.exe', 'bin/tor/lyrebird.exe' }
                  else { 'Detour', 'bin/xray/xray', 'bin/sing_box/sing-box', 'bin/zapret/tpws/tpws' }
          foreach ($f in $need + 'bin/geoip.dat', 'bin/geosite.dat') {
            if (-not (Test-Path (Join-Path $x "Detour/$f"))) { throw "missing in archive: $f" }
          }
          $line = (Get-Content "$($a.FullName).sha256").Split(' ')[0]
          if ($line -ne (Get-FileHash $a.FullName -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'sha256 file does not match' }
          Write-Host "OK: $($a.Name)"

      - uses: actions/upload-artifact@v7
        with:
          name: Detour-${{ matrix.rid }}
          path: |
            out/Detour*.zip
            out/Detour*.tar.gz
            out/Detour*.sha256

  # One job publishes the release once Windows and Linux are built (one description, one SHA256SUMS.txt).
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          cat *.sha256 | sort -k2 > SHA256SUMS.txt
          rm *.sha256
          sha256sum -c SHA256SUMS.txt

      - name: GitHub release
        # v2.6.2, pinned by commit: a moved tag can't change what runs with write access.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: dist/*
          generate_release_notes: true

  # macOS for release tags, after the release is published: a long runner queue no longer holds it back.
  build-macos:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/package-release.ps1 -OutDir out -Version $env:GITHUB_REF_NAME -Rid ${{ matrix.rid }}

      - name: Check archive
        shell: pwsh
        run: |
          $x = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force $x | Out-Null
          $a = Get-ChildItem out -File -Filter 'Detour*.tar.gz' | Select-Object -First 1
          tar -xzf $a.FullName -C $x; if ($LASTEXITCODE) { throw 'tar failed' }
          foreach ($f in 'Detour', 'bin/xray/xray', 'bin/sing_box/sing-box', 'bin/zapret/tpws/tpws', 'bin/geoip.dat', 'bin/geosite.dat') {
            if (-not (Test-Path (Join-Path $x "Detour/$f"))) { throw "missing in archive: $f" }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: Detour-${{ matrix.rid }}
          path: |
            out/Detour*.tar.gz
            out/Detour*.sha256

  # Adds the macOS archives (and their .sha256) to the release published above.
  publish-macos:
    needs: build-macos
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build-macos.result != 'skipped' && needs.build-macos.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Detour-osx-*
          path: dist
          merge-multiple: true

      - name: Add to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: dist/*
