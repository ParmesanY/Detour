name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch cancels the run still in progress; tag builds are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    strategy:
      fail-fast: false
      # macOS runners are scarce and often time out in the queue: build them only for release tags.
      matrix:
        include: ${{ fromJSON(github.ref_type == 'tag' && '[{"os":"windows-latest","rid":"win-x64","test":true},{"os":"ubuntu-latest","rid":"linux-x64","test":false},{"os":"macos-latest","rid":"osx-arm64","test":false},{"os":"macos-latest","rid":"osx-x64","test":false}]' || '[{"os":"windows-latest","rid":"win-x64","test":true},{"os":"ubuntu-latest","rid":"linux-x64","test":false}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Tags point at commits already tested on main.
      - name: Test
        if: matrix.test && github.ref_type != 'tag'
        run: dotnet test --project v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj

      # Full package: app + Xray + sing-box + geo files + rule sets + zapret (winws or tpws),
      # so the first start works where GitHub is blocked.
      - name: Package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          ./tools/package-release.ps1 -OutDir out -Version $ver -Rid ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: Detour-${{ matrix.rid }}
          path: |
            out/Detour*.zip
            out/Detour*.tar.gz

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Detour-*.zip
            out/Detour-*.tar.gz
          generate_release_notes: true
