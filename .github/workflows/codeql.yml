name: CodeQL

# Static analysis of the C# code (command injection, unsafe deserialization, path traversal...).
# Results: Security → Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Build
        run: |
          dotnet build v2rayN/v2rayN/v2rayN.csproj -c Release
          dotnet build v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:csharp'
